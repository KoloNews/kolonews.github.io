<!doctype html>
<html lang="uk" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Коло Новин</title>
  <meta name="description" content="Головні новини світу за останні 24 години">
  <meta name="theme-color" content="#0c0e12">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Коло Новин">
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/icon-180.png">
  <link rel="manifest" href="manifest.webmanifest">
  <script>
    // тему ставимо до малювання сторінки, щоб не було «спалаху»
    try { var t = localStorage.getItem('kolo-theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <div id="splash" class="splash" aria-hidden="true">
    <div class="splash-ring"><span class="logo big"><i class="orbit"></i></span></div>
    <div class="splash-name"><span>Коло</span> <span>Новин</span></div>
  </div>

  <header class="topbar">
    <a class="brand" href="#world" aria-label="Коло Новин">
      <span class="logo" id="logo"><i class="orbit"></i></span>
      <span class="brand-name">Коло Новин</span>
    </a>
    <div class="top-right">
      <span class="updated" id="updated"></span>
      <button class="icon-btn" id="refresh" type="button">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.3 5.7M20 4v7h-7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <div class="lang-seg" id="lang-seg" role="radiogroup"></div>
      <div class="lang-drop" id="lang-drop">
        <button class="lang-btn" id="lang-btn" type="button" aria-haspopup="true" aria-expanded="false"></button>
        <div class="lang-menu" id="lang-menu" role="menu"></div>
      </div>
      <button class="icon-btn" id="theme" type="button">
        <svg class="sun" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><circle cx="12" cy="12" r="4.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <svg class="moon" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M20.5 14.5A8.5 8.5 0 0 1 9.5 3.5a8.5 8.5 0 1 0 11 11z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
      </button>
    </div>
  </header>

  <div class="chips-wrap">
    <nav class="chips" id="chips-t" aria-label="Розділи"></nav>
    <nav class="chips chips-r" id="chips-r" aria-label="Регіон"></nav>
  </div>

  <div class="layout">
    <aside class="sidebar">
      <div class="side-label" id="label-t"></div>
      <nav class="side-group" id="side-topics" aria-label="Розділи"></nav>
      <div class="side-label" id="label-r"></div>
      <nav class="side-group" id="side-regions" aria-label="Регіон"></nav>
    </aside>
    <main class="main" id="main">
      <div id="list-view">
        <div class="section-head" id="section-head">
          <h1 id="sec-title"></h1>
          <p id="sec-sub"></p>
        </div>
        <div class="grid" id="grid"></div>
      </div>
      <article class="story" id="story-view" hidden></article>
    </main>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="assets/app.js"></script>
</body>
</html>
