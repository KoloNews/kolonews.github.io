# Автооновлення «Коло Новин» на GitHub Pages: збирає новини, перекладає і публікує сайт.
# Розклад (cron) у цьому репозиторії GitHub не запускав жодного разу, тому основний механізм —
# ланцюжок: кожне оновлення в кінці чекає ~15 хв і запускає наступне. Розклад лишається запасним.
name: Оновлення новин

on:
  schedule:
    # не на початку години (:00) — GitHub у цей час перевантажений і часто пропускає запуски
    - cron: "7,27,47 * * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write
  actions: write   # щоб запускати наступне оновлення

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    concurrency:
      group: build
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Відновити кеш перекладів і фото
        uses: actions/cache@v4
        with:
          path: |
            data/translations.json
            data/meta_cache.json
            data/img_cache.json
            data/ai_cache.json
            data/s
          key: kolo-cache-${{ github.run_id }}
          restore-keys: kolo-cache-
      - name: Встановити Pillow (порівняння фото)
        run: pip install --quiet pillow
      - name: Зібрати новини
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          AI_PER_RUN: "30"
        run: python3 collector/fetch_news.py
      - name: Підготувати сайт
        run: |
          mkdir -p _site/data
          cp -r index.html manifest.webmanifest assets _site/
          # позначка версії: браузер одразу бере нові файли, а не старі з кешу
          sed -i "s#assets/app.js\"#assets/app.js?v=${GITHUB_SHA::8}\"#; s#assets/style.css\"#assets/style.css?v=${GITHUB_SHA::8}\"#" _site/index.html
          cp data/uk.json data/en.json data/zh.json data/ru.json _site/data/
          cp -r data/uk data/en data/zh data/ru _site/data/
          # сторінки для поширення в соцмережах (з прев'ю) і 404 → на головну
          cp -r data/s _site/s
          cp 404.html _site/
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # Ланцюжок: через ~15 хв запускаємо наступне оновлення.
  # Продовжує лише НАЙНОВІШИЙ запуск — так ручні запуски не створюють подвійних ланцюжків.
  next:
    needs: deploy
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Зачекати й запустити наступне оновлення
        run: |
          sleep 900
          newest=$(gh run list --workflow update.yml --limit 1 --json databaseId --jq '.[0].databaseId')
          if [ "$newest" = "${{ github.run_id }}" ]; then
            gh workflow run update.yml --ref main && echo "Наступне оновлення запущено"
          else
            echo "Є новіший запуск ($newest) — він продовжить ланцюжок"
          fi

  # GitHub вимикає розклад, якщо в репозиторії 60 днів не було змін.
  # Раз на 50 днів робимо порожній коміт, щоб автооновлення не зупинилось.
  keepalive:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          last=$(git log -1 --format=%ct)
          if [ $(( $(date +%s) - last )) -gt $((50 * 86400)) ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "Підтримка автооновлення"
            git push
          fi
